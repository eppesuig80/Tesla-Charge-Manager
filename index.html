<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Gestione delle ricariche Tesla, tariffe e costi"><title>Tesla Charge Manager</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f8f8f8;background:#0b0b0b;--accent:#e82127;--border:#303034;--muted:#aaaab2;--panel:#18181b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #404047;background:#25252a;color:white;min-height:44px}label{display:block;font-size:13px;color:#c4c4cc;margin-bottom:6px}.shell{max-width:960px;margin:auto;padding:25px 18px 112px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.logo{font-size:17px;letter-spacing:.18em;font-weight:800}.red{color:var(--accent)}.sub{font-size:12px;color:var(--muted)}h1{font-size:28px;margin:0 0 7px}h2{font-size:19px;margin:0 0 18px}h3{font-size:15px;margin:0 0 10px}.muted{color:var(--muted)}.stack{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.panel{border:1px solid var(--border);border-radius:17px;background:var(--panel);padding:18px;min-width:0}.metric{font-size:27px;font-weight:750;letter-spacing:-.04em;margin-top:10px;overflow-wrap:anywhere}.hero{background:linear-gradient(145deg,#252529,#121214);border:1px solid #38383e;min-height:184px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero .metric{font-size:22px}.battery{width:83px;height:125px;border:3px solid #555;border-radius:14px;padding:6px;position:relative;flex-shrink:0}.battery:before{content:'';position:absolute;width:25px;height:7px;background:#555;top:-10px;left:26px;border-radius:4px}.battery span{display:block;position:absolute;bottom:6px;left:6px;right:6px;height:34%;background:linear-gradient(#f24b4e,#a4191c);border-radius:6px}.btn{border:none;border-radius:11px;background:var(--accent);color:#fff;padding:13px 16px;font-weight:700;min-height:44px}.btn.secondary{background:#303036}.btn.ghost{background:transparent;border:1px solid #4a4a51}.btn.small{padding:8px 12px;font-size:13px;min-height:36px}.actions{display:flex;flex-wrap:wrap;gap:9px}.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.hidden{display:none!important}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #34343a}.item:last-child{border-bottom:0}.item .right{text-align:right;flex-shrink:0}.pill{display:inline-block;font-size:11px;border-radius:30px;padding:4px 8px;background:#33333a;color:#ddd}.pill.warn{background:#604a1e;color:#ffe1a0}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#171719ec;border-top:1px solid #3d3d40;padding:9px 6px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(15px);z-index:20}.nav button{background:none;border:none;color:#b3b3ba;min-width:0;flex:1;max-width:150px;padding:7px 0;font-size:11px}.nav button.active{color:#fff;font-weight:700}.nav button b{display:block;font-size:20px;margin-bottom:3px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:white;border:1px solid #777;border-radius:12px;padding:12px 16px;z-index:30;max-width:90%;box-shadow:0 8px 30px #0009}.chart{display:flex;align-items:end;gap:6px;height:140px;overflow-x:auto;padding:0 0 16px}.bar{min-width:20px;flex:1;max-width:65px;background:linear-gradient(#eb3b41,#7e1518);border-radius:5px 5px 0 0;position:relative}.bar small{position:absolute;bottom:-17px;text-align:center;width:100%;font-size:10px;color:#aaa}.note{line-height:1.55;color:#bbb;font-size:13px}.empty{padding:24px;color:#9c9ca4;text-align:center}.filter{margin-bottom:15px}dialog{border:1px solid #4b4b52;background:#1c1c20;color:white;border-radius:18px;width:min(95vw,530px);max-height:90dvh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}@media(max-width:540px){.shell{padding:20px 13px 108px}.grid,.formgrid{gap:10px}.panel{padding:14px}.metric{font-size:23px}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:155px}.logo{letter-spacing:.12em;font-size:15px}}
</style></head><body><div class="shell"><header class="header"><div><div class="logo">TESLA <span class="red">CHARGE</span> MANAGER</div><div class="sub">Model Y Premium · gestione ricariche</div></div><span id="sync-indicator" class="pill">Locale</span></header><main id="app"></main></div><nav class="nav" id="nav"><button data-tab="home" class="active"><b>⌂</b>Home</button><button data-tab="new"><b>＋</b>Ricarica</button><button data-tab="history"><b>▤</b>Storico</button><button data-tab="stats"><b>▥</b>Statistiche</button><button data-tab="settings"><b>⚙</b>Impostazioni</button></nav><div id="toast" class="toast hidden" role="status"></div><dialog id="dialog"></dialog><script>
'use strict';
const KEY='tcm-data-v1', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)), iso=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'}), eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0), kwh=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:3}).format(n||0), dt=s=>{if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
function initial(){return {version:1,providers:[{id:'home',name:'Casa',type:'Casa'},{id:'tesla',name:'Tesla Supercharger',type:'Tesla'},{id:'third',name:'Colonnine terze parti',type:'Terze parti'}],rates:[],sessions:[],kmPerKwh:6,updatedAt:new Date().toISOString()}}
function read(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.sessions)&&Array.isArray(v.rates)&&Array.isArray(v.providers))return v}catch(e){}return initial()}
let db=read();if(!db.providers.some(p=>p.type==='Terze parti'))db.providers.push({id:'third',name:'Colonnine terze parti',type:'Terze parti'});if(!(Number(db.kmPerKwh)>0))db.kmPerKwh=6;let tab='home',editing=null,historyFilter='',statMonth=iso().slice(0,7);
function persist(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));window.dispatchEvent(new Event('tcm-local-save'))}catch(e){toast('Salvataggio non riuscito: memoria dispositivo esaurita');return false}return true}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3300)}
function num(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
function dec(n){return n==null?'':String(n)}
function getRate(provider,date,slot=''){return db.rates.filter(r=>r.providerId===provider&&r.start<=date&&(provider==='tesla'?(r.slot||'diurna')===slot:!r.slot)).sort((a,b)=>b.start.localeCompare(a.start)||(b.created||'').localeCompare(a.created||''))[0]||null}
function money(energy,price){if(energy==null||price==null)return null;return Math.round((energy*price+Number.EPSILON)*100)/100}
function provider(id){return db.providers.find(p=>p.id===id)}
function totals(list){const completed=list.filter(s=>s.cost!=null);return {cost:completed.reduce((a,s)=>a+s.cost,0),energy:list.reduce((a,s)=>a+(s.energyBilled??s.energyAdded??0),0),count:list.length,missing:list.filter(s=>s.cost==null).length}}
function nav(t){tab=t;editing=null;render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)nav(b.dataset.tab)});
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h={home:homePage,new:formPage,history:historyPage,stats:statsPage,settings:settingsPage}[tab];$('#app').innerHTML=h();bindPage()}
function homePage(){let today=iso(),month=today.slice(0,7),ts=totals(db.sessions.filter(s=>s.date===today)),ms=totals(db.sessions.filter(s=>s.date.startsWith(month))),last=[...db.sessions].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))[0];return `<section class="stack"><div><h1>La tua Tesla</h1><p class="muted" style="margin:0">Tutte le tue ricariche, sotto controllo.</p></div><div class="panel hero"><div><div class="sub">MODEL Y PREMIUM</div><div class="metric">Stato batteria<br><span class="muted">Non disponibile</span></div><p class="note">Collegamento Tesla non attivo.<br>Non vengono mostrati dati simulati.</p></div><div class="battery" aria-label="Batteria: dato non disponibile"><span style="height:0;background:transparent"></span></div></div><div class="grid"><div class="panel"><div class="sub">SPESA OGGI</div><div class="metric">${eur(ts.cost)}</div><div class="sub">${ts.count} sessioni</div></div><div class="panel"><div class="sub">SPESA DEL MESE</div><div class="metric">${eur(ms.cost)}</div><div class="sub">${ms.count} sessioni</div></div><div class="panel"><div class="sub">kWh OGGI</div><div class="metric">${kwh(ts.energy)}</div></div><div class="panel"><div class="sub">kWh DEL MESE</div><div class="metric">${kwh(ms.energy)}</div></div></div>${ms.missing?`<div class="panel note">Attenzione: ${ms.missing} ricariche del mese senza costo calcolabile. I totali monetari escludono queste sessioni.</div>`:''}<button class="btn" data-go="new">＋ Registra una ricarica</button><div class="panel"><h2>Ultima ricarica</h2>${last?sessionItem(last):'<div class="empty">Non hai ancora registrato ricariche.</div>'}</div></section>`}
function fields(){const date=editing?.date||iso(),sel=editing?.providerId||'home',slot=editing?.tariffSlot||'diurna';const opts=(type)=>db.providers.filter(p=>p.type===type && p.id!=='third').map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');return `<div class="formgrid"><div class="field"><label>Data *</label><input id="f-date" type="date" value="${esc(date)}" required></div><div class="field"><label>Operatore *</label><select id="f-provider"><optgroup label="Casa">${opts('Casa')}</optgroup><optgroup label="Tesla">${opts('Tesla')}</optgroup><optgroup label="Colonnine di terze parti">${opts('Terze parti')}</optgroup></select><div class="note">Per aggiungere Enel X, Free To X, Nextcharge, EVway o altri, vai in Impostazioni → Colonnine di terze parti.</div></div><div class="field full" id="tesla-slot-wrap" style="display:none"><label>Tariffa Tesla *</label><select id="f-slot"><option value="diurna" ${slot==='diurna'?'selected':''}>Diurna</option><option value="notturna" ${slot==='notturna'?'selected':''}>Notturna</option></select><div class="note">Seleziona la fascia applicata dalla stazione Tesla. Non vengono presunti orari validi ovunque.</div></div><div class="field full"><label>Energia caricata (kWh) *</label><input id="f-energyAdded" type="number" min="0" step="0.001" inputmode="decimal" required value="${dec(editing?.energyAdded??editing?.energyBilled)}"></div><div class="field full"><label>Chilometraggio totale dell'auto (km) · facoltativo</label><input id="f-odometer" type="number" min="0" step="1" value="${dec(editing?.odometer)}"></div></div>`}
function formPage(){return `<section class="stack"><div><h1>${editing?'Modifica ricarica':'Nuova ricarica'}</h1><p class="muted">Inserisci i kWh: costo e km stimati si calcolano automaticamente.</p></div><div class="panel"><form id="charge-form" class="stack">${fields()}<div class="panel"><div class="sub">COSTO CALCOLATO</div><div id="preview" class="metric">—</div><div id="preview-note" class="note"></div><div style="margin-top:12px" class="sub">KM DI AUTONOMIA AGGIUNTI (STIMA)</div><div id="km-preview" class="metric">—</div><div class="note">Stima basata sui km/kWh configurati in Impostazioni; non è un dato letto dalla Tesla.</div></div><div class="actions"><button type="submit" class="btn">${editing?'Salva modifiche':'Salva ricarica'}</button>${editing?'<button type="button" class="btn secondary" data-go="history">Annulla</button>':''}</div></form></div></section>`}
function sessionItem(s,showDelete=false){let p=provider(s.providerId);return `<div class="item"><div><b>${esc(p?.name||s.providerName||'Fornitore eliminato')}</b><div class="sub">${dt(s.date)}${s.providerId==='tesla'?' · '+(s.tariffSlot==='notturna'?'Notturna':'Diurna'):''} · ${kwh(s.energyBilled??s.energyAdded)} kWh · ${s.kmAdded!=null?kwh(s.kmAdded)+' km'+(s.kmEstimated?' stimati':''): 'km non disponibili'}</div><span class="pill ${s.cost==null?'warn':''}">${s.cost==null?'Da completare':s.estimated?'Costo stimato':'Registrata'}</span></div><div class="right"><b>${s.cost===null?'—':eur(s.cost)}</b><div style="margin-top:8px"><button class="btn small secondary" data-edit="${esc(s.id)}">Apri</button>${showDelete?`<button class="btn small ghost" data-delete="${esc(s.id)}" style="margin-left:6px">Elimina</button>`:``}</div></div></div>`}
function historyPage(){let list=[...db.sessions].filter(s=>!historyFilter||s.providerId===historyFilter).sort((a,b)=>(b.date+' '+(b.start||'')).localeCompare(a.date+' '+(a.start||'')));return `<section class="stack"><div><h1>Storico</h1><p class="muted">${list.length} sessioni · dalla più recente</p></div><div class="panel"><label>Filtra per fornitore</label><select id="history-filter"><option value="">Tutti</option>${db.providers.map(p=>`<option value="${esc(p.id)}" ${historyFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="panel">${list.length?list.map(s=>sessionItem(s,true)).join(''):'<div class="empty">Nessuna ricarica registrata.</div>'}${db.sessions.length?`<div class="actions" style="margin-top:20px"><button type="button" class="btn ghost" id="delete-all-sessions">Elimina tutte le ricariche</button></div>`:``}</div></section>`}
function statsPage(){let list=db.sessions.filter(s=>s.date.startsWith(statMonth)),sum=totals(list),days={};list.forEach(s=>days[s.date]=(days[s.date]||0)+(s.cost||0));let vals=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...vals.map(x=>x[1]));let groups=['Casa','Tesla','Terze parti'].map(type=>({type,...totals(list.filter(s=>(provider(s.providerId)?.type)===type))}));return `<section class="stack"><h1>Statistiche</h1><div class="panel"><label>Seleziona il mese</label><input type="month" id="stat-month" value="${esc(statMonth)}"></div><div class="grid"><div class="panel"><div class="sub">SPESA TOTALE</div><div class="metric">${eur(sum.cost)}</div></div><div class="panel"><div class="sub">ENERGIA</div><div class="metric">${kwh(sum.energy)} <span class="sub">kWh</span></div></div></div>${sum.missing?`<div class="note">${sum.missing} sessioni prive di costo sono escluse dalla spesa.</div>`:''}<div class="panel"><h2>Spese giornaliere</h2>${vals.length?`<div class="chart">${vals.map(([day,value])=>`<div class="bar" title="${dt(day)}: ${eur(value)}" style="height:${Math.max(3,value/max*112)}px"><small>${day.slice(-2)}</small></div>`).join('')}</div>`:'<div class="empty">Nessun dato per questo mese.</div>'}</div><div class="panel"><h2>Per categoria</h2>${groups.map(g=>`<div class="item"><span>${g.type}</span><span><b>${eur(g.cost)}</b><div class="sub">${kwh(g.energy)} kWh · ${g.count} sessioni</div></span></div>`).join('')}</div></section>`}
function settingsPage(){let today=iso();return `<section class="stack"><h1>Impostazioni</h1><div class="panel"><h2>Fornitori e tariffe</h2><p class="note">Le tariffe valgono dalla data scelta. Le sessioni già salvate conservano il proprio prezzo.</p>${db.providers.map(p=>{let r=getRate(p.id,today);return `<div class="item"><div><b>${esc(p.name)}</b><div class="sub">${esc(p.type)} · ${p.id==='tesla'?('Diurna: '+(getRate(p.id,today,'diurna')?eur(getRate(p.id,today,'diurna').price)+'/kWh':'non impostata')+' · Notturna: '+(getRate(p.id,today,'notturna')?eur(getRate(p.id,today,'notturna').price)+'/kWh':'non impostata')):(r?eur(r.price)+'/kWh':'Tariffa non impostata')}</div></div><div class="actions"><button class="btn small secondary" data-rate="${esc(p.id)}">Tariffa</button>${!['home','tesla','third'].includes(p.id)?`<button class="btn small ghost" data-rename="${esc(p.id)}">Modifica</button>`:''}</div></div>`}).join('')}<p class="note">Puoi creare tutti gli operatori che vuoi: Enel X, Free To X, Nextcharge, EVway e altri, con una tariffa indipendente per ciascuno.</p><div class="actions" style="margin-top:15px"><button class="btn secondary" id="add-provider">＋ Aggiungi colonnina di terze parti</button><button class="btn ghost" id="show-rates">Storico tariffe</button></div></div><div class="panel"><h2>Stima km aggiunti</h2><p class="note">Quanti km di autonomia stimare per ogni kWh caricato? Valore iniziale: 6 km/kWh. Modificalo secondo il consumo medio della tua Tesla.</p><label>Km per kWh</label><div class="actions"><input style="max-width:180px" id="km-per-kwh" type="number" min="0.1" max="20" step="0.1" value="${esc(db.kmPerKwh)}"><button class="btn secondary" id="save-km-factor">Salva</button></div></div><div class="panel"><h2>Backup JSON</h2><p class="note">Esporta periodicamente una copia: i dati locali del browser possono essere cancellati dal sistema o dall'utente.</p><div class="actions"><button class="btn" id="export">Esporta backup</button><button class="btn secondary" id="import">Importa backup</button><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div></div><div class="panel"><h2>Sincronizzazione</h2><p class="note">I dati vengono salvati localmente. Accedi con email/password per abilitare Firebase e usare lo stesso account su tutti i dispositivi. Prima del primo accesso, esporta un backup JSON da ogni dispositivo.</p><div id="firebase-status" class="note">Firebase: connessione in preparazione…</div><div class="actions" style="margin-top:12px"><button class="btn" type="button" id="firebase-login">Accedi con email</button><button class="btn secondary" type="button" id="firebase-register">Crea account</button><button class="btn secondary hidden" type="button" id="firebase-logout">Esci da Google</button><button class="btn ghost hidden" type="button" id="firebase-resync">Sincronizza ora</button></div></div><div class="panel"><h2>Collegamento Tesla</h2><p class="note">Inattivo. Nessun accesso all'account Tesla, nessuna richiesta API, nessun addebito. Le funzioni automatiche e le notifiche di ricarica richiedono una futura integrazione autorizzata.</p><span class="pill">Non collegata</span></div><div class="panel"><h2>Notifiche</h2><p class="note">Gli avvisi interni segnalano modifiche e possibili errori. Le notifiche push a app chiusa non sono implementate in questa versione.</p></div></section>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=db.sessions.find(s=>s.id===b.dataset.edit);tab='new';render();$('#charge-form').insertAdjacentHTML('beforeend',`<button type="button" class="btn ghost" id="delete-session">Elimina questa ricarica</button>`);$('#delete-session').onclick=()=>{if(confirm('Eliminare definitivamente questa ricarica?')){db.sessions=db.sessions.filter(s=>s.id!==editing.id);persist();toast('Ricarica eliminata');nav('history')}}});if(tab==='new')bindForm();if(tab==='history'){ $('#history-filter').onchange=e=>{historyFilter=e.target.value;render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const s=db.sessions.find(x=>x.id===b.dataset.delete);if(!s)return;if(!confirm('Eliminare definitivamente questa ricarica del '+dt(s.date)+'?'))return;db.sessions=db.sessions.filter(x=>x.id!==s.id);if(persist()){toast('Ricarica eliminata');render()}});const all=$('#delete-all-sessions');if(all)all.onclick=()=>{const count=db.sessions.length;if(!count)return;if(!confirm('ATTENZIONE: eliminare TUTTE le '+count+' ricariche registrate?\n\nQuesta operazione cancella anche le ricariche sincronizzate con Firebase, quando collegato. Esporta prima un backup JSON.'))return;db.sessions=[];if(persist()){toast('Tutte le ricariche eliminate');render()}};}if(tab==='stats')$('#stat-month').onchange=e=>{statMonth=e.target.value||iso().slice(0,7);render()};if(tab==='settings'){bindSettings();window.TCMFirebase?.refreshUI()}}
function bindForm(){const form=$('#charge-form'),val=id=>num($('#f-'+id).value);const slot=()=>provider($('#f-provider').value)?.type==='Tesla'?$('#f-slot').value:'';const preview=()=>{const energy=val('energyAdded'),pid=$('#f-provider').value,isTesla=provider(pid)?.type==='Tesla';$('#tesla-slot-wrap').style.display=isTesla?'':'none';const r=getRate(pid,$('#f-date').value,slot());$('#preview').textContent=energy!=null&&r?eur(money(energy,r.price)):'Da completare';$('#preview-note').textContent=!r?'Imposta prima la tariffa di questo operatore e fascia in Impostazioni':energy==null?'Inserisci i kWh caricati':`Tariffa applicata: ${eur(r.price)}/kWh${isTesla?' · '+slot():''}`;$('#km-preview').textContent=energy==null?'—':new Intl.NumberFormat('it-IT',{maximumFractionDigits:1}).format(energy*db.kmPerKwh)+' km'};['provider','date','slot'].forEach(n=>$('#f-'+n).addEventListener('change',preview));form.querySelectorAll('input').forEach(e=>e.addEventListener('input',preview));preview();form.onsubmit=e=>{e.preventDefault();const date=$('#f-date').value,providerId=$('#f-provider').value,energy=val('energyAdded');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!provider(providerId)||energy==null){toast('Inserisci data, operatore e kWh validi');return}const tariffSlot=slot(),r=getRate(providerId,date,tariffSlot),odometer=val('odometer'),cost=r?money(energy,r.price):null,now=new Date().toISOString();let obj={...(editing||{}),id:editing?.id||uuid(),date,providerId,providerName:provider(providerId).name,tariffSlot,energyAdded:energy,energyBilled:null,price:r?.price??null,override:null,cost,estimated:false,kmManual:null,kmAdded:Math.round(energy*db.kmPerKwh*10)/10,kmEstimated:true,odometer,start:'',end:'',notes:'',batteryStart:null,batteryEnd:null,rangeStart:null,rangeEnd:null,createdAt:editing?.createdAt||now,updatedAt:now};if(editing)db.sessions=db.sessions.map(s=>s.id===editing.id?obj:s);else db.sessions.push(obj);if(persist()){toast(editing?'Ricarica aggiornata':'Ricarica salvata');nav('h let p=provider(b.dataset.rename);showDialog('Modifica fornitore',`<div><label>Nome</label><input name="name" required maxlength="100" value="${esc(p.name)}"></div><div><label>Categoria</label><select name="type">${['Terze parti','Tesla','Casa'].map(x=>`<option ${x===p.type?'selected':''}>${x}</option>`).join('')}</select></div>`,d=>{let n=d.querySelector('[name=name]').value.trim();if(!n){toast('Nome obbligatorio');return}p.name=n;p.type=d.querySelector('[name=type]').value;persist();d.close();render()})});$('#show-rates').onclick=()=>{let lines=db.rates.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(r=>`<div class="item"><div>${esc(provider(r.providerId)?.name||'Fornitore')}</div><div>${eur(r.price)}/kWh${r.providerId==='tesla'?' · '+(r.slot||'diurna'):''}<br><span class="sub">dal ${dt(r.start)}</span></div></div>`).join('');let d=$('#dialog');d.innerHTML=`<h2>Storico tariffe</h2>${lines||'<p class="note">Nessuna tariffa configurata.</p>'}<button class="btn secondary" id="close-dialog">Chiudi</button>`;d.showModal();$('#close-dialog').onclick=()=>d.close()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tesla-charge-backup-${iso()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup pronto')};$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('File troppo grande');const o=JSON.parse(await file.text());if(o.version!==1||!Array.isArray(o.sessions)||!Array.isArray(o.providers)||!Array.isArray(o.rates)||o.sessions.length>100000)throw Error('Formato backup non supportato');if(o.providers.some(p=>typeof p.id!=='string'||typeof p.name!=='string'||!['Casa','Tesla','Terze parti'].includes(p.type))||o.rates.some(r=>typeof r.providerId!=='string'||num(r.price)==null||!/^\d{4}-\d{2}-\d{2}$/.test(r.start))||o.sessions.some(s=>typeof s.id!=='string'||typeof s.providerId!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||s.cost!=null&&num(s.cost)==null))throw Error('Il backup contiene dati non validi');if(!confirm(`Ripristinare ${o.sessions.length} sessioni, ${o.providers.length} fornitori e ${o.rates.length} tariffe? ATTENZIONE: tutti i dati attuali saranno sostituiti. Esporta prima un backup.`))return;db={version:1,providers:o.providers,rates:o.rates,sessions:o.sessions,updatedAt:new Date().toISOString()};if(persist()){toast('Ripristino completato');render()}}catch(err){toast('Importazione fallita: '+err.message)}finally{e.target.value=''}}}

async function initializeSync(force){

}
