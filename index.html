const uuid=()=>((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)), iso=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'}), eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0), kwh=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:3}).format(n||0), dt=s=>{if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
function initial(){return {version:1,providers:[{id:'home',name:'Casa',type:'Casa'},{id:'tesla',name:'Tesla Supercharger',type:'Tesla'},{id:'third',name:'Colonnine terze parti',type:'Terze parti'}],rates:[],sessions:[],kmPerKwh:6,updatedAt:new Date().toISOString()}}
function read(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.sessions)&&Array.isArray(v.rates)&&Array.isArray(v.providers))return v}catch(e){}return initial()}
let db=read();if(!db.providers.some(p=>p.type==='Terze parti'))db.providers.push({id:'third',name:'Colonnine terze parti',type:'Terze parti'});if(!(Number(db.kmPerKwh)>0))db.kmPerKwh=6;let tab='home',editing=null,historyFilter='',statMonth=iso().slice(0,7);
function persist(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));window.dispatchEvent(new Event('tcm-local-save'))}catch(e){toast('Salvataggio non riuscito: memoria dispositivo esaurita');return false}return true}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3300)}
function num(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
function dec(n){return n==null?'':String(n)}
function getRate(provider,date,slot=''){return db.rates.filter(r=>r.providerId===provider&&r.start<=date&&(provider==='tesla'?(r.slot||'diurna')===slot:!r.slot)).sort((a,b)=>b.start.localeCompare(a.start)||(b.created||'').localeCompare(a.created||''))[0]||null}
function money(energy,price){if(energy==null||price==null)return null;return Math.round((energy*price+Number.EPSILON)*100)/100}
function provider(id){return db.providers.find(p=>p.id===id)}
function displayedCost(s){if(s.cost!=null&&Number.isFinite(Number(s.cost)))return Number(s.cost);if(s.price!=null&&Number.isFinite(Number(s.price))){const energy=Number(s.energyBilled??s.energyAdded);if(Number.isFinite(energy))return money(energy,Number(s.price))}return null}
function totals(list){const amounts=list.map(displayedCost);return {cost:amounts.reduce((a,v)=>a+(v??0),0),energy:list.reduce((a,s)=>a+(s.energyBilled??s.energyAdded??0),0),count:list.length,missing:amounts.filter(v=>v==null).length}}
function nav(t){tab=t;editing=null;render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)nav(b.dataset.tab)});

function teslaCarInCharge(){
  const t=db.teslaBattery||{};
  const state=String(t.statoRicarica||'').toLowerCase();
  return Number(t.potenzaRicarica_kW||0)>0 || ['charging','complete','starting','stopped','in carica','ricarica completata'].some(x=>state.includes(x));
}
function teslaCarPhoto(){return teslaCarInCharge()?TESLA_CAR_PHOTO_CHARGING:TESLA_CAR_PHOTO_PARKED;}
function teslaCarDescription(){return teslaCarInCharge()?'Model Y collegata alla ricarica':'Model Y senza cavo di ricarica';}
function homePage(){let today=iso(),month=today.slice(0,7),ts=totals(db.sessions.filter(s=>String(s.date||'').slice(0,10)===today)),ms=totals(db.sessions.filter(s=>String(s.date||'').startsWith(month))),last=[...db.sessions].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))[0];return `<section class="stack"><div><h1>La tua Tesla</h1><p class="muted" style="margin:0">Tutte le tue ricariche, sotto controllo.</p></div><div class="panel hero"><div><div class="sub">MODEL Y PREMIUM</div><div class="metric">Stato batteria<br><span class="red">${db.teslaBattery?.batteria_percentuale!=null?esc(db.teslaBattery.batteria_percentuale)+"%":"Non disponibile"}</span></div><p class="note">${db.teslaBattery?.autonomia_km!=null?"Autonomia: "+esc(db.teslaBattery.autonomia_km)+" km. ":""}${db.teslaBattery?.lettoAlle?"Ultima lettura: "+esc(new Date(db.teslaBattery.lettoAlle).toLocaleString("it-IT")):"Dati Tesla non ancora acquisiti."}<br>La lettura non risveglia la vettura.</p><button class="btn small secondary" id="refresh-battery" type="button">Aggiorna batteria</button><div id="battery-message" class="note" role="status"></div></div><div class="tesla-car-visual" role="img" aria-label="Tesla Model Y Premium, immagine ricostruita dalle foto dell’auto"><img class="tesla-real-car" src="${teslaCarPhoto()}" alt="${teslaCarDescription()}" loading="eager" decoding="async"></div></div><div class="grid"><div class="panel"><div class="sub">SPESA OGGI</div><div class="metric">${eur(ts.cost)}</div><div class="sub">${ts.count} sessioni${ts.missing?` · ${ts.missing} senza costo`:``}</div></div><div class="panel"><div class="sub">SPESA DEL MESE</div><div class="metric">${eur(ms.cost)}</div><div class="sub">${ms.count} sessioni</div></div><div class="panel"><div class="sub">kWh OGGI</div><div class="metric">${kwh(ts.energy)}</div></div><div class="panel"><div class="sub">kWh DEL MESE</div><div class="metric">${kwh(ms.energy)}</div></div></div>${ts.missing?`<div class="panel note">Oggi ${ts.missing} ricarica/ricariche senza costo calcolabile: imposta la tariffa o completa la sessione. Non sono comprese nella spesa odierna.</div>`:''}${ms.missing?`<div class="panel note">Attenzione: ${ms.missing} ricariche del mese senza costo calcolabile. I totali monetari escludono queste sessioni.</div>`:''}<button class="btn" data-go="new">＋ Registra una ricarica</button><div class="panel"><h2>Ultima ricarica</h2>${last?sessionItem(last):'<div class="empty">Non hai ancora registrato ricariche.</div>'}</div></section>`}
const PRESET_THIRD_PARTY = ['A2A E-moving','Atlante','Be Charge / Plenitude On The Road','Duferco Energia','Electra','Enel X Way','E.ON Drive','Ewiva','Fastned','Free To X','IONITY','Neogy','Nextcharge','Powerdot','Repower','Route220','Tesla Destination Charging','Virta','Wroom','Altra colonnina'];
function chooseThirdPartyPreset(select){
 const choice=select.value;
 if(!choice.startsWith('preset:'))return;
 const name=choice.slice(7);
 if(name==='Altra colonnina'){
   const typed=prompt('Nome della colonnina di terze parti:');
   if(!typed||!typed.trim()){select.value='home';return;}
   const custom=typed.trim();
   const existing=db.providers.find(p=>p.name.toLowerCase()===custom.toLowerCase());
   if(existing){select.value=existing.id;return;}
   const obj={id:uuid(),name:custom,type:'Terze parti'};
   db.providers.push(obj);persist();select.add(new Option(custom,obj.id));select.value=obj.id;return;
 }
 const existing=db.providers.find(p=>p.type==='Terze parti'&&p.name.toLowerCase()===name.toLowerCase());
 if(existing){select.value=existing.id;return;}
 const obj={id:uuid(),name,type:'Terze parti'};
 db.providers.push(obj);persist();select.add(new Option(name,obj.id));select.value=obj.id;
}
function fields(){const date=editing?.date||iso(),sel=editing?.providerId||'home',slot=editing?.tariffSlot||'diurna';const opts=(type)=>db.providers.filter(p=>p.type===type && p.id!=='third').map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');return `<div class="formgrid"><div class="field"><label>Data *</label><input id="f-date" type="date" value="${esc(date)}" required></div><div class="field"><label>Operatore *</label><select id="f-provider"><optgroup label="Casa">${opts('Casa')}</optgroup><optgroup label="Tesla">${opts('Tesla')}</optgroup><optgroup label="Colonnine di terze parti">${opts('Terze parti')}${PRESET_THIRD_PARTY.filter(name=>!db.providers.some(p=>p.type==='Terze parti'&&p.name.toLowerCase()===name.toLowerCase())).map(name=>`<option value="preset:${esc(name)}">${esc(name)}</option>`).join('')}</optgroup></select><div class="note">Per aggiungere Enel X, Free To X, Nextcharge, EVway o altri, vai in Impostazioni → Colonnine di terze parti.</div></div><div class="field full" id="tesla-slot-wrap" style="display:none"><label>Tariffa Tesla *</label><select id="f-slot"><option value="diurna" ${slot==='diurna'?'selected':''}>Diurna</option><option value="notturna" ${slot==='notturna'?'selected':''}>Notturna</option></select><div class="note">Seleziona la fascia applicata dalla stazione Tesla. Non vengono presunti orari validi ovunque.</div></div><div class="field full"><label>Energia caricata (kWh) *</label><input id="f-energyAdded" type="number" min="0" step="0.001" inputmode="decimal" required value="${dec(editing?.energyAdded??editing?.energyBilled)}"></div><div class="field full"><label>Chilometraggio totale dell'auto (km) · facoltativo</label><input id="f-odometer" type="number" min="0" step="1" value="${dec(editing?.odometer)}"></div></div>`}

function importTeslaBatch(){
 const raw=$('#tesla-batch').value.trim();if(!raw){toast('Inserisci almeno una riga');return}
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length>300){toast('Massimo 300 righe per importazione');return}
 const incoming=[],seen=new Set();
 for(let i=0;i<lines.length;i++){
  const parts=lines[i].split(';').map(x=>x.trim());if(parts.length!==4){toast('Riga '+(i+1)+': servono 4 valori separati da ;');return}
  const [date,category,energyText,costText]=parts;
  const parsed=new Date(date+'T12:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(parsed.getTime())||parsed.toISOString().slice(0,10)!==date){toast('Data non valida alla riga '+(i+1));return}
  const energy=num(energyText),cost=num(costText);if(energy===null||energy<=0||cost===null){toast('kWh o costo non validi alla riga '+(i+1));return}
  const name=category.toLocaleLowerCase('it-IT');
  let p=name==='casa'?provider('home'):name==='tesla'||name==='supercharger'?provider('tesla'):name==='altro'?db.providers.find(x=>x.id==='third'):db.providers.find(x=>x.name.toLocaleLowerCase('it-IT')===name && x.id!=='third');
  if(!p){toast('Categoria sconosciuta alla riga '+(i+1)+': aggiungi prima il fornitore in Impostazioni');return}
  const key=date+'|'+p.id;if(seen.has(key)){toast('Riga '+(i+1)+': data e categoria ripetute');return}seen.add(key);
  if(db.sessions.some(s=>s.date===date&&s.providerId===p.id)){toast('Riga '+(i+1)+': esiste già una ricarica per questa data e categoria. Controlla lo Storico per evitare doppioni.');return}
  incoming.push({date,p,energy,cost});
 }
 const msg=incoming.map(x=>`${dt(x.date)} · ${x.p.name}: ${kwh(x.energy)} kWh · ${eur(x.cost)}`).join('\n');
 if(!confirm(`Importare ${incoming.length} riepiloghi giornalieri dalle statistiche Tesla?\n\n${msg}\n\nI valori sono quelli riportati da Tesla; il prezzo €/kWh è ricavato dal costo totale della riga.`))return;
 const now=new Date().toISOString();const old=structuredClone(db);
 for(const x of incoming){const price=x.cost/x.energy;db.sessions.push({id:uuid(),date:x.date,providerId:x.p.id,providerName:x.p.name,tariffSlot:'',energyAdded:x.energy,energyBilled:null,price,override:null,cost:x.cost,estimated:false,kmManual:null,kmAdded:Math.round(x.energy*db.kmPerKwh*10)/10,kmEstimated:true,odometer:null,start:'',end:'',notes:'Riepilogo giornaliero importato manualmente dalle statistiche Tesla; valori potenzialmente arrotondati.',batteryStart:null,batteryEnd:null,rangeStart:null,rangeEnd:null,createdAt:now,updatedAt:now,importSource:'tesla-daily-summary'});}

}

(db.rates.some(r=>r.providerId===id&&r.start===start&&(r.slot||'diurna')===(rateSlot||'diurna'))&&!confirm('Esiste già una tariffa per questa data. Sostituirla?'))return;db.rates=db.rates.filter(r=>!(r.providerId===id&&r.start===start&&(r.slot||'diurna')===(rateSlot||'diurna')));db.rates.push({id:uuid(),providerId:id,price,start,slot:rateSlot,created:new Date().toISOString()});persist();d.close();render();toast('Tariffa salvata')})});document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let p=provider(b.dataset.rename);showDialog('Modifica fornitore',`<div><label>Nome</label><input name="name" required maxlength="100" value="${esc(p.name)}"></div><div><label>Categoria</label><select name="type">${['Terze parti','Tesla','Casa'].map(x=>`<option ${x===p.type?'selected':''}>${x}</option>`).join('')}</select></div>`,d=>{let n=d.querySelector('[name=name]').value.trim();if(!n){toast('Nome obbligatorio');return}p.name=n;p.type=d.querySelector('[name=type]').value;persist();d.close();render()})});$('#show-rates').onclick=()=>{let lines=db.rates.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(r=>`<div class="item"><div>${esc(provider(r.providerId)?.name||'Fornitore')}</div><div>${eur(r.price)}/kWh${r.providerId==='tesla'?' · '+(r.slot||'diurna'):''}<br><span class="sub">dal ${dt(r.start)}</span></div></div>`).join('');let d=$('#dialog');d.innerHTML=`<h2>Storico tariffe</h2>${lines||'<p class="note">Nessuna tariffa configurata.</p>'}<button class="btn secondary" id="close-dialog">Chiudi</button>`;d.showModal();$('#close-dialog').onclick=()=>d.close()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tesla-charge-backup-${iso()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup pronto')};$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('File troppo grande');const o=JSON.parse(await file.text());if(o.version!==1||!Array.isArray(o.sessions)||!Array.isArray(o.providers)||!Array.isArray(o.rates)||o.sessions.length>100000)throw Error('Formato backup non supportato');if(o.providers.some(p=>typeof p.id!=='string'||typeof p.name!=='string'||!['Casa','Tesla','Terze parti'].includes(p.type))||o.rates.some(r=>typeof r.providerId!=='string'||num(r.price)==null||!/^\d{4}-\d{2}-\d{2}$/.test(r.start))||o.sessions.some(s=>typeof s.id!=='string'||typeof s.providerId!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||s.cost!=null&&num(s.cost)==null))throw Error('Il backup contiene dati non validi');if(!confirm(`Ripristinare ${o.sessions.length} sessioni, ${o.providers.length} fornitori e ${o.rates.length} tariffe? ATTENZIONE: tutti i dati attuali saranno sostituiti. Esporta prima un backup.`))return;db={version:1,providers:o.providers,rates:o.rates,sessions:o.sessions,updatedAt:new Date().toISOString()};if(persist()){toast('Ripristino completato');render()}}catch(err){toast('Importazione fallita: '+err.message)}finally{e.target.value=''}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='home')render()});
setInterval(()=>{if(tab==='home'&&!document.hidden)render()},60000);
window.addEventListener('storage',e=>{if(e.key===KEY){db=read();render();toast('Dati aggiornati da un’altra scheda')}});
// Collegamento con il modulo Firebase: non cambia lo schema dei dati locale.
window.TCMBridge={get:()=>structuredClone(db), set:(value)=>{db=value;localStorage.setItem(KEY,JSON.stringify(db));render()}, saveBattery:(value)=>{db.teslaBattery=value;if(persist())render()}, refresh:()=>render()};
// Versione HTML autonoma: nessun service worker esterno richiesto.
render();

</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
const firebaseConfig={
 apiKey:'AIzaSyCHbkKSfMwEXBA5_W05hXq_585QLKLmIGQ',
 authDomain:'tesla-charge-manager.firebaseapp.com',
 projectId:'tesla-charge-manager',
 storageBucket:'tesla-charge-manager.firebasestorage.app',
 messagingSenderId:'686667512220',
 appId:'1:686667512220:web:de7370ca55f70ea4c1b059'
};

// Batteria: una sola lettura su richiesta, senza chiavi segrete nel browser.
window.TCMBattery = {
  update: async () => {
    const button=document.getElementById("refresh-battery");
    const message=document.getElementById("battery-message");
    if(!auth?.currentUser){if(message)message.textContent="Accedi a Firebase in Impostazioni per aggiornare.";return;}
    if(button){button.disabled=true;button.textContent="Lettura in corso…";}
    try{
      const idToken=await auth.currentUser.getIdToken();
      const result=await fetch("https://peppe-tesla-api.eppesuig80.workers.dev/api/battery",{
        method:"POST",
        headers:{"Authorization":"Bearer "+idToken}
      });
      const data=await result.json();
      if(!result.ok)throw new Error(data.errore||("Errore HTTP "+result.status));
      if(data.batteria_percentuale==null)throw new Error("Percentuale non disponibile nei dati Tesla");
      window.TCMBridge.saveBattery(data);
    }catch(error){
      if(message)message.textContent="Aggiornamento non riuscito: "+error.message;
    }finally{
      if(button){button.disabled=false;button.textContent="Aggiorna batteria";}
    }
  }
};
const ui={user:null,ready:false,busy:false,error:'',message:'Accesso Firebase non effettuato',unsubscribe:null,docRef:null,syncTimer:null,ignore:false};
const valid=d=>d&&d.version===1&&Array.isArray(d.sessions)&&Array.isArray(d.rates)&&Array.isArray(d.providers);
const timestamp=d=>Date.parse(d?.updatedAt||'')||0;
const hasData=d=>!!(d?.sessions?.length||d?.rates?.length||d?.providers?.some(p=>!['home','tesla','third'].includes(p.id)));
const syncMark=uid=>'tcm-cloud-connected-'+uid;
const equalData=(a,b)=>{if(!a||!b)return false;const clean=x=>{const c=structuredClone(x);delete c.updatedAt;return JSON.stringify(c)};return clean(a)===clean(b)};
const status=msg=>{ui.message=msg;refreshUI()};
function refreshUI(){
 const light=document.getElementById('sync-indicator');if(light){light.textContent=ui.user?(ui.ready?'Cloud attivo':'Cloud in attesa'):'Solo locale';}
 const el=document.getElementById('firebase-status');if(!el)return;
 el.textContent=ui.message+(ui.user?' · '+ui.user.email:'')+(ui.error?' · '+ui.error:'');
 const login=document.getElementById('firebase-login'),logout=document.getElementById('firebase-logout'),resync=document.getElementById('firebase-resync');
 if(login){login.classList.toggle('hidden',!!ui.user);login.onclick=()=>showAuthDialog(false);}
 const register=document.getElementById('firebase-register');if(register){register.classList.toggle('hidden',!!ui.user);register.onclick=()=>showAuthDialog(true);}
 if(logout){logout.classList.toggle('hidden',!ui.user);logout.onclick=()=>signOut(auth);}
 if(resync){resync.classList.toggle('hidden',!ui.user);resync.textContent=ui.conflict?'Risolvi differenze':'Sincronizza ora';resync.onclick=()=>initializeSync(true);}
}
window.TCMFirebase={refreshUI};
let auth,firestore;
try{
 const app=initializeApp(firebaseConfig);auth=getAuth(app);firestore=getFirestore(app);
 await setPersistence(auth,browserLocalPersistence);
 onAuthStateChanged(auth,async user=>{
  if(ui.unsubscribe){ui.unsubscribe();ui.unsubscribe=null;}
  clearTimeout(ui.syncTimer);ui.user=user;ui.ready=false;ui.docRef=null;ui.error='';ui.conflict=false;
  if(!user){status('Dati salvati solo su questo dispositivo. Accedi per sincronizzarli.');return;}
  status('Connessione al database…');await initializeSync(false);
 });
}catch(e){ui.error=e.message;status('Firebase non disponibile: dati locali al sicuro');}
function showAuthDialog(register){
 if(!auth){ui.error='Firebase non inizializzato';status('Accesso non disponibile');return;}
 const dlg=document.getElementById('dialog');
 if(dlg.open)return;
 dlg.innerHTML=`<h2>${register?'Crea account Firebase':'Accedi a Firebase'}</h2><form id="tcm-auth-form" class="stack"><p class="note">Usa lo stesso indirizzo email e la stessa password su iPhone, iPad e Mac. Non inserire le credenziali Tesla.</p><div><label>Email</label><input id="tcm-email" type="email" autocomplete="email" required></div><div><label>Password (almeno 6 caratteri)</label><input id="tcm-password" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="6" required></div><p id="tcm-auth-error" class="note" role="alert"></p><div class="actions"><button class="btn" id="tcm-auth-submit" type="submit">${register?'Crea account':'Accedi'}</button><button class="btn secondary" type="button" id="tcm-auth-cancel">Annulla</button></div></form>`;
 dlg.showModal();
 dlg.querySelector('#tcm-auth-cancel').onclick=()=>dlg.close();
 dlg.querySelector('#tcm-auth-form').onsubmit=async e=>{
  e.preventDefault();const email=dlg.querySelector('#tcm-email').value.trim(),password=dlg.querySelector('#tcm-password').value;
  const btn=dlg.querySelector('#tcm-auth-submit');btn.disabled=true;
  try{
   if(register)await createUserWithEmailAndPassword(auth,email,password);
   else await signInWithEmailAndPassword(auth,email,password);
   dlg.close();ui.error='';status('Accesso riuscito. Verifica i dati prima di sincronizzare.');
  }catch(error){
   const descriptions={'auth/email-already-in-use':'Account già presente: usa Accedi.','auth/invalid-email':'Indirizzo email non valido.','auth/invalid-credential':'Email o password errati.','auth/weak-password':'Scegli una password più lunga.','auth/operation-not-allowed':'Abilita Email/password in Firebase Authentication.','auth/too-many-requests':'Troppi tentativi: riprova più tardi.','auth/network-request-failed':'Connessione Internet non disponibile.','auth/unauthorized-domain':'Dominio non autorizzato da Firebase.'};
   dlg.querySelector('#tcm-auth-error').textContent=descriptions[error.code]||('Errore: '+(error.code||error.message));
   btn.disabled=false;
  }
 };
}
async function initializeSync(force){
 if(!ui.user||ui.busy||!navigator.onLine){status('Offline: dati locali disponibili. Riprova quando torna Internet.');return;}
 ui.busy=true;ui.ready=false;
 try{
  const ref=doc(firestore,'users',ui.user.uid,'data','main');ui.docRef=ref;
  const snapshot=await getDoc(ref);
  const remote=snapshot.exists()?snapshot.data()?.payload:null;
  const local=window.TCMBridge.get();
  if(remote&&!valid(remote))throw new Error('Il documento remoto non è compatibile; nessun dato è stato sovrascritto.');
  if(!remote){await setDoc(ref,{payload:local});}
  else if(!equalData(remote,local)){
   if(hasData(local)&&hasData(remote)){
    if(!force && localStorage.getItem(syncMark(ui.user.uid))==='1' && !localStorage.getItem('tcm-pending-cloud')){
     // Dispositivo già collegato: il cloud è la fonte autorevole all'apertura.
     // Conserva comunque una copia locale di emergenza prima dell'aggiornamento.
     localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));
     window.TCMBridge.set(remote);
    } else if(force){
     const chooseLocal=confirm('Dati differenti tra questo dispositivo e Firebase.\n\nOK: sostituisci i dati cloud con quelli locali.\nANNULLA: usa i dati cloud su questo dispositivo.\n\nEsporta prima il backup JSON.');
     if(chooseLocal)await setDoc(ref,{payload:local});
     else {localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));window.TCMBridge.set(remote);}
    }else{
     // Nessun popup all'avvio: serve una decisione esplicita nell'interfaccia.
     ui.conflict=true;ui.ready=false;
     status('Dati locali e cloud differenti. Apri Impostazioni → Sincronizzazione e premi «Risolvi differenze». Nessun dato è stato sostituito.');
     return;
    }
   }else if(hasData(local)&&!hasData(remote)){
    if(localStorage.getItem(syncMark(ui.user.uid))==='1' && !force){
     localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));window.TCMBridge.set(remote);
    }else await setDoc(ref,{payload:local});
   }else window.TCMBridge.set(remote);
  }
  if(ui.unsubscribe)ui.unsubscribe();
  ui.unsubscribe=onSnapshot(ref,snap=>{
   if(!ui.ready||!snap.exists()||snap.metadata.hasPendingWrites)return;
   const remote=snap.data()?.payload;if(!valid(remote))return;
   const local=window.TCMBridge.get();
   if(JSON.stringify(remote)===JSON.stringify(local))return;
   if(ui.localDirty)return; // priorità alle modifiche locali non ancora caricate
   window.TCMBridge.set(remote);status('Sincronizzato tra i dispositivi');
  },e=>{ui.error=e.message;status('Errore di sincronizzazione');});
  ui.ready=true;ui.localDirty=false;ui.conflict=false;localStorage.setItem(syncMark(ui.user.uid),'1');localStorage.removeItem('tcm-pending-cloud');status('Sincronizzato tra i dispositivi');
 }catch(e){ui.error=e.message;status('Sincronizzazione non riuscita; dati locali conservati');}
 finally{ui.busy=false;}
}
window.addEventListener('tcm-local-save',()=>{
 if(!ui.user||!ui.ready)return;
 ui.localDirty=true;localStorage.setItem('tcm-pending-cloud','1');status('Modifiche da sincronizzare…');
 clearTimeout(ui.syncTimer);
 ui.syncTimer=setTimeout(async()=>{
  if(!ui.docRef||!navigator.onLine)return status('Offline: modifiche conservate sul dispositivo');
  try{await setDoc(ui.docRef,{payload:window.TCMBridge.get()});ui.localDirty=false;localStorage.removeItem('tcm-pending-cloud');status('Sincronizzato tra i dispositivi');}
  catch(e){ui.error=e.message;status('Salvataggio cloud fallito; dati locali conservati');}
 },450);
});
window.addEventListener('online',()=>{if(ui.user)initializeSync(true)});
refreshUI();
</script></body></html>
