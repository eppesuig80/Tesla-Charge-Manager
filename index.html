function read(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.sessions)&&Array.isArray(v.rates)&&Array.isArray(v.providers))return v}catch(e){}return initial()}
let db=read();if(!db.providers.some(p=>p.type==='Terze parti'))db.providers.push({id:'third',name:'Colonnine terze parti',type:'Terze parti'});if(!(Number(db.kmPerKwh)>0))db.kmPerKwh=6;let tab='home',editing=null,historyFilter='',statMonth=iso().slice(0,7);

function num(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}

function getRate(provider,date,slot=''){return db.rates.filter(r=>r.providerId===provider&&r.start<=date&&(provider==='tesla'?(r.slot||'diurna')===slot:!r.slot)).sort((a,b)=>b.start.localeCompare(a.start)||(b.created||'').localeCompare(a.created||''))[0]||null}
function money(energy,price){if(energy==null||price==null)return null;return Math.round((energy*price+Number.EPSILON)*100)/100}
function provider(id){return db.providers.find(p=>p.id===id)}
function displayedCost(s){if(s.cost!=null&&Number.isFinite(Number(s.cost)))return Number(s.cost);if(s.price!=null&&Number.isFinite(Number(s.price))){const energy=Number(s.energyBilled??s.energyAdded);if(Number.isFinite(energy))return money(energy,Number(s.price))}return null}
function totals(list){const amounts=list.map(displayedCost);return {cost:amounts.reduce((a,v)=>a+(v??0),0),energy:list.reduce((a,s)=>a+(s.energyBilled??s.energyAdded??0),0),count:list.length,missing:amounts.filter(v=>v==null).length}}

const PRESET_THIRD_PARTY = ['A2A E-moving','Atlante','Be Charge / Plenitude On The Road','Duferco Energia','Electra','Enel X Way','E.ON Drive','Ewiva','Fastned','Free To X','IONITY','Neogy','Nextcharge','Powerdot','Repower','Route220','Tesla Destination Charging','Virta','Wroom','Altra colonnina'];
function chooseThirdPartyPreset(select){
 const choice=select.value;
 if(!choice.startsWith('preset:'))return;
 const name=choice.slice(7);
 if(name==='Altra colonnina'){
   const typed=prompt('Nome della colonnina di terze parti:');
   if(!typed||!typed.trim()){select.value='home';return;}
   const custom=typed.trim();
   const existing=db.providers.find(p=>p.name.toLowerCase()===custom.toLowerCase());
   if(existing){select.value=existing.id;return;}
   const obj={id:uuid(),name:custom,type:'Terze parti'};
   db.providers.push(obj);persist();select.add(new Option(custom,obj.id));select.value=obj.id;return;
 }
 const existing=db.providers.find(p=>p.type==='Terze parti'&&p.name.toLowerCase()===name.toLowerCase());
 if(existing){select.value=existing.id;return;}
 const obj={id:uuid(),name,type:'Terze parti'};
 db.providers.push(obj);persist();select.add(new Option(name,obj.id));select.value=obj.id;
}
function fields(){const date=editing?.date||iso(),sel=editing?.providerId||'home',slot=editing?.tariffSlot||'diurna';const opts=(type)=>db.providers.filter(p=>p.type===type && p.id!=='third').map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');return `<div class="formgrid"><div class="field"><label>Data *</label><input id="f-date" type="date" value="${esc(date)}" required></div><div class="field"><label>Operatore *</label><select id="f-provider"><optgroup label="Casa">${opts('Casa')}</optgroup><optgroup label="Tesla">${opts('Tesla')}</optgroup><optgroup label="Colonnine di terze parti">${opts('Terze parti')}${PRESET_THIRD_PARTY.filter(name=>!db.providers.some(p=>p.type==='Terze parti'&&p.name.toLowerCase()===name.toLowerCase())).map(name=>`<option value="preset:${esc(name)}">${esc(name)}</option>`).join('')}</optgroup></select><div class="note">Per aggiungere Enel X, Free To X, Nextcharge, EVway o altri, vai in Impostazioni → Colonnine di terze parti.</div></div><div class="field full" id="tesla-slot-wrap" style="display:none"><label>Tariffa Tesla *</label><select id="f-slot"><option value="diurna" ${slot==='diurna'?'selected':''}>Diurna</option><option value="notturna" ${slot==='notturna'?'selected':''}>Notturna</option></select><div class="note">Seleziona la fascia applicata dalla stazione Tesla. Non vengono presunti orari validi ovunque.</div></div><div class="field full"><label>Energia caricata (kWh) *</label><input id="f-energyAdded" type="number" min="0" step="0.001" inputmode="decimal" required value="${dec(editing?.energyAdded??editing?.energyBilled)}"></div><div class="field full"><label>Chilometraggio totale dell'auto (km) · facoltativo</label><input id="f-odometer" type="number" min="0" step="1" value="${dec(editing?.odometer)}"></div></div>`}
function formPage(){return `<section class="stack"><div><h1>${editing?'Modifica ricarica':'Nuova ricarica'}</h1><p class="muted">Inserisci i kWh: costo e km stimati si calcolano automaticamente.</p></div><div class="panel"><form id="charge-form" class="stack">${fields()}<div class="panel"><div class="sub">COSTO CALCOLATO</div><div id="preview" class="metric">—</div><div id="preview-note" class="note"></div><div style="margin-top:12px" class="sub">KM DI AUTONOMIA AGGIUNTI (STIMA)</div><div id="km-preview" class="metric">—</div><div class="note">Stima basata sui km/kWh configurati in Impostazioni; non è un dato letto dalla Tesla.</div></div><div class="actions"><button type="submit" class="btn">${editing?'Salva modifiche':'Salva ricarica'}</button>${editing?'<button type="button" class="btn secondary" data-go="history">Annulla</button>':''}</div></form></div></section>`}
function sessionItem(s,showDelete=false){
 let p=provider(s.providerId);
 if(showDelete){
  const shortDate=dt(s.date).replace(/\d{4}$/,y=>y.slice(-2));
  const name=p?.name||s.providerName||'Fornitore';
  const title=s.providerId==='tesla'?(s.tariffSlot==='notturna'?' · notte':' · giorno'):'';
  const energy=kwh(s.energyBilled??s.energyAdded);
  const cost=s.cost==null?'Da calc.':eur(s.cost);
  return `<div class="charge-row" title="${esc(name)} · ${esc(dt(s.date))}"><span class="charge-date">${esc(shortDate)}</span><span class="charge-provider" title="${esc(name)}">${esc(name)}${title}</span><span class="charge-energy">${energy} kWh</span><strong class="charge-cost" title="${s.cost==null?'Tariffa mancante':'Costo'}">${cost}</strong><div class="charge-actions"><button type="button" class="charge-icon" data-edit="${esc(s.id)}" aria-label="Apri ricarica" title="Apri ricarica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 10h18"/></svg></button><button type="button" class="charge-icon delete" data-delete="${esc(s.id)}" aria-label="Elimina ricarica" title="Elimina ricarica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4m-8 3 1 14h10l1-14M10 11v6m4-6v6"/></svg></button></div></div>`;
 }
 return `<div class="item"><div><b>${esc(p?.name||s.providerName||'Fornitore eliminato')}</b><div class="sub">${dt(s.date)}${s.providerId==='tesla'?' · '+(s.tariffSlot==='notturna'?'Notturna':'Diurna'):''} · ${kwh(s.energyBilled??s.energyAdded)} kWh · ${s.kmAdded!=null?kwh(s.kmAdded)+' km'+(s.kmEstimated?' stimati':''): 'km non disponibili'}</div><span class="pill ${s.cost==null?'warn':''}">${s.cost==null?'Da completare':s.estimated?'Costo stimato':'Registrata'}</span></div><div class="right"><b>${s.cost===null?'—':eur(s.cost)}</b><div style="margin-top:8px"><button class="btn small secondary" data-edit="${esc(s.id)}">Apri</button></div></div></div>`;
}
function historyPage(){
 let list=[...db.sessions].filter(s=>!historyFilter||s.providerId===historyFilter).sort((a,b)=>(b.date+' '+(b.start||'')).localeCompare(a.date+' '+(a.start||'')));
 const energy=list.reduce((sum,s)=>{const n=Number(s.energyBilled??s.energyAdded);return sum+(Number.isFinite(n)?n:0)},0);
 const amounts=list.map(displayedCost);
 const cost=amounts.reduce((sum,n)=>sum+(n??0),0);
 const missing=amounts.filter(n=>n==null).length;
 return `<section class="stack"><div><h1>Storico</h1><p class="muted">${list.length} sessioni · dalla più recente</p></div><div class="panel"><label>Filtra per fornitore</label><select id="history-filter"><option value="">Tutti</option>${db.providers.map(p=>`<option value="${esc(p.id)}" ${historyFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="history-totals" aria-label="Riepilogo delle ricariche visualizzate"><div class="history-total"><span class="history-total-label">Totale energia caricata</span><strong class="history-total-value">${kwh(energy)} <small>kWh</small></strong></div><div class="history-total"><span class="history-total-label">Spesa totale</span><strong class="history-total-value">${eur(cost)}</strong></div></div>${missing?`<p class="history-cost-note">${missing} ${missing===1?'ricarica senza costo non inclusa':'ricariche senza costo non incluse'} nella spesa.</p>`:''}<div class="panel">${list.length?list.map(s=>sessionItem(s,true)).join(''):'<div class="empty">Nessuna ricarica registrata.</div>'}${db.sessions.length?`<div class="actions" style="margin-top:20px"><button type="button" class="btn ghost" id="delete-all-sessions">Elimina tutte le ricariche</button></div>`:``}</div></section>`
}
function statsPage(){let list=db.sessions.filter(s=>s.date.startsWith(statMonth)),sum=totals(list),days={};list.forEach(s=>days[s.date]=(days[s.date]||0)+(s.cost||0));let vals=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...vals.map(x=>x[1]));let groups=['Casa','Tesla','Terze parti'].map(type=>({type,...totals(list.filter(s=>(provider(s.providerId)?.type)===type))}));return `<section class="stack"><h1>Statistiche</h1><div class="panel"><label>Seleziona il mese</label><input type="month" id="stat-month" value="${esc(statMonth)}"></div><div class="grid"><div class="panel"><div class="sub">SPESA TOTALE</div><div class="metric">${eur(sum.cost)}</div></div><div class="panel"><div class="sub">ENERGIA</div><div class="metric">${kwh(sum.energy)} <span class="sub">kWh</span></div></div></div>${sum.missing?`<div class="note">${sum.missing} sessioni prive di costo sono escluse dalla spesa.</div>`:''}<div class="panel"><h2>Spese giornaliere</h2>${vals.length?`<div class="chart">${vals.map(([day,value])=>`<div class="bar" title="${dt(day)}: ${eur(value)}" style="height:${Math.max(3,value/max*112)}px"><small>${day.slice(-2)}</small></div>`).join('')}</div>`:'<div class="empty">Nessun dato per questo mese.</div>'}</div><div class="panel"><h2>Per categoria</h2>${groups.map(g=>`<div class="item"><span>${g.type}</span><span><b>${eur(g.cost)}</b><div class="sub">${kwh(g.energy)} kWh · ${g.count} sessioni</div></span></div>`).join('')}</div></section>`}
function settingsPage(){let today=iso();return `<section class="stack"><h1>Impostazioni</h1><div class="panel"><h2>Fornitori e tariffe</h2><p class="note">Le tariffe valgono dalla data scelta. Le sessioni già salvate conservano il proprio prezzo.</p>${db.providers.map(p=>{let r=getRate(p.id,today);return `<div class="item"><div><b>${esc(p.name)}</b><div class="sub">${esc(p.type)} · ${p.id==='tesla'?('Diurna: '+(getRate(p.id,today,'diurna')?eur(getRate(p.id,today,'diurna').price)+'/kWh':'non impostata')+' · Notturna: '+(getRate(p.id,today,'notturna')?eur(getRate(p.id,today,'notturna').price)+'/kWh':'non impostata')):(r?eur(r.price)+'/kWh':'Tariffa non impostata')}</div></div><div class="actions"><button class="btn small secondary" data-rate="${esc(p.id)}">Tariffa</button>${!['home','tesla','third'].includes(p.id)?`<button class="btn small ghost" data-rename="${esc(p.id)}">Modifica</button>`:''}</div></div>`}).join('')}<p class="note">Puoi creare tutti gli operatori che vuoi: Enel X, Free To X, Nextcharge, EVway e altri, con una tariffa indipendente per ciascuno.</p><div class="actions" style="margin-top:15px"><button class="btn secondary" id="add-provider">＋ Aggiungi colonnina di terze parti</button><button class="btn ghost" id="show-rates">Storico tariffe</button></div></div><div class="panel"><h2>Stima km aggiunti</h2><p class="note">Quanti km di autonomia stimare per ogni kWh caricato? Valore iniziale: 6 km/kWh. Modificalo secondo il consumo medio della tua Tesla.</p><label>Km per kWh</label><div class="actions"><input style="max-width:180px" id="km-per-kwh" type="number" min="0.1" max="20" step="0.1" value="${esc(db.kmPerKwh)}"><button class="btn secondary" id="save-km-factor">Salva</button></div></div><div class="panel"><h2>Importazione assistita da Tesla</h2><p class="note">Dalle Statistiche di ricarica Tesla, copia i dati giornalieri, una riga per giorno e categoria. Non è un collegamento automatico: i valori sono quelli visualizzati nell’app Tesla (eventualmente arrotondati).</p><label>Formato: AAAA-MM-GG; Categoria; kWh; Euro</label><textarea id="tesla-batch" rows="5" placeholder="2026-10-01; Casa; 11; 1&#10;2026-10-18; Tesla; 35; 14" style="font-size:16px;resize:vertical"></textarea><p class="note">Categorie: Casa, Tesla, Altro oppure il nome preciso di una colonnina già configurata. Se il giorno contiene più sessioni della stessa categoria, la riga rappresenta un riepilogo giornaliero. L’importazione non inventa sessioni individuali.</p><div class="actions"><button type="button" class="btn secondary" id="tesla-batch-import">Verifica e importa</button></div></div><div class="panel"><h2>Backup JSON</h2><p class="note">Esporta periodicamente una copia: i dati locali del browser possono essere cancellati dal sistema o dall'utente.</p><div class="actions"><button class="btn" id="export">Esporta backup</button><button class="btn secondary" id="import">Importa backup</button><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div></div><div class="panel"><h2>Sincronizzazione</h2><p class="note">I dati vengono salvati localmente. Accedi con email/password per abilitare Firebase e usare lo stesso account su tutti i dispositivi. Prima del primo accesso, esporta un backup JSON da ogni dispositivo.</p><div id="firebase-status" class="note">Firebase: connessione in preparazione…</div><div class="actions" style="margin-top:12px"><button class="btn" type="button" id="firebase-login">Accedi con email</button><button class="btn secondary" type="button" id="firebase-register">Crea account</button><button class="btn secondary hidden" type="button" id="firebase-logout">Esci da Google</button><button class="btn ghost hidden" type="button" id="firebase-resync">Sincronizza ora</button></div></div><div class="panel" id="tesla-connection"><h2>Collegamento Tesla — predisposizione</h2><p class="note">Applicazione sviluppatore Tesla: PeppeChargeMonitor. La registrazione dell’applicazione è completata, ma l’accesso ai dati dell’auto non è ancora configurato.</p><span class="pill">Non collegata — nessuna richiesta API</span><div class="stack" style="margin-top:14px"><h3>Configurazione sicura</h3><p class="note">L’accesso ufficiale richiede OAuth, un componente server protetto per lo scambio del codice e un Client Secret. Il segreto non deve essere inserito in questa pagina né in GitHub Pages, Firebase Firestore o nel backup JSON.</p><p class="note">Indirizzo di ritorno registrato: <code>https://eppesuiq80.github.io/Tesla-Charge-Manager/</code>. Deve corrispondere esattamente a quello impostato nella console Tesla.</p><p class="note">Per continuare serviranno: Client ID pubblico, componente server con archiviazione sicura dei token, configurazione OAuth e verifica del limite di fatturazione (massimo desiderato 1–2 € al mese). Nessuna di queste operazioni è avviata automaticamente.</p><div class="actions"><a class="btn secondary" href="https://developer.tesla.com/" target="_blank" rel="noopener noreferrer">Apri Tesla Developer</a><a class="btn ghost" href="https://developer.tesla.com/docs/fleet-api/authentication/third-party-tokens" target="_blank" rel="noopener noreferrer">Documentazione OAuth</a></div><p class="note">La batteria nella Home resta correttamente “Non disponibile” finché la lettura reale non è attivata. Firebase e le ricariche non vengono modificati.</p></div></div><div class="panel"><h2>Notifiche</h2><p class="note">Gli avvisi interni segnalano modifiche e possibili errori. Le notifiche push a app chiusa non sono implementate in questa versione.</p></div></section>`}

  }catch(error){
   const descriptions={'auth/email-already-in-use':'Account già presente: usa Accedi.','auth/invalid-email':'Indirizzo email non valido.','auth/invalid-credential':'Email o password errati.','auth/weak-password':'Scegli una password più lunga.','auth/operation-not-allowed':'Abilita Email/password in Firebase Authentication.','auth/too-many-requests':'Troppi tentativi: riprova più tardi.','auth/network-request-failed':'Connessione Internet non disponibile.','auth/unauthorized-domain':'Dominio non autorizzato da Firebase.'};
   dlg.querySelector('#tcm-auth-error').textContent=descriptions[error.code]||('Errore: '+(error.code||error.message));
   btn.disabled=false;
  }
 };
}
async function initializeSync(force){
 if(!ui.user||ui.busy||!navigator.onLine){status('Offline: dati locali disponibili. Riprova quando torna Internet.');return;}
 ui.busy=true;ui.ready=false;
 try{
  const ref=doc(firestore,'users',ui.user.uid,'data','main');ui.docRef=ref;
  const snapshot=await getDoc(ref);
  const remote=snapshot.exists()?snapshot.data()?.payload:null;
  const local=window.TCMBridge.get();
  if(remote&&!valid(remote))throw new Error('Il documento remoto non è compatibile; nessun dato è stato sovrascritto.');
  if(!remote){await setDoc(ref,{payload:local});}
  else if(!equalData(remote,local)){
   if(hasData(local)&&hasData(remote)){
    if(!force && localStorage.getItem(syncMark(ui.user.uid))==='1' && !localStorage.getItem('tcm-pending-cloud')){
     // Dispositivo già collegato: il cloud è la fonte autorevole all'apertura.
     // Conserva comunque una copia locale di emergenza prima dell'aggiornamento.
     localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));
     window.TCMBridge.set(remote);
    } else if(force){
     const chooseLocal=confirm('Dati differenti tra questo dispositivo e Firebase.\n\nOK: sostituisci i dati cloud con quelli locali.\nANNULLA: usa i dati cloud su questo dispositivo.\n\nEsporta prima il backup JSON.');
     if(chooseLocal)await setDoc(ref,{payload:local});
     else {localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));window.TCMBridge.set(remote);}
    }else{
     // Nessun popup all'avvio: serve una decisione esplicita nell'interfaccia.
     ui.conflict=true;ui.ready=false;
     status('Dati locali e cloud differenti. Apri Impostazioni → Sincronizzazione e premi «Risolvi differenze». Nessun dato è stato sostituito.');
     return;
    }
   }else if(hasData(local)&&!hasData(remote)){
    if(localStorage.getItem(syncMark(ui.user.uid))==='1' && !force){
     localStorage.setItem('tcm-before-cloud-restore',JSON.stringify(local));window.TCMBridge.set(remote);
    }else await setDoc(ref,{payload:local});
   }else window.TCMBridge.set(remote);
  }
  if(ui.unsubscribe)ui.unsubscribe();
  ui.unsubscribe=onSnapshot(ref,snap=>{
   if(!ui.ready||!snap.exists()||snap.metadata.hasPendingWrites)return;
   const remote=snap.data()?.payload;if(!valid(remote))return;
   const local=window.TCMBridge.get();
   if(JSON.stringify(remote)===JSON.stringify(local))return;
   if(ui.localDirty)return; // priorità alle modifiche locali non ancora caricate
   window.TCMBridge.set(remote);status('Sincronizzato tra i dispositivi');
  },e=>{ui.error=e.message;status('Errore di sincronizzazione');});
  ui.ready=true;ui.localDirty=false;ui.conflict=false;localStorage.setItem(syncMark(ui.user.uid),'1');localStorage.removeItem('tcm-pending-cloud');status('Sincronizzato tra i dispositivi');
 }catch(e){ui.error=e.message;status('Sincronizzazione non riuscita; dati locali conservati');}
 finally{ui.busy=false;}
}
window.addEventListener('tcm-local-save',()=>{
 if(!ui.user||!ui.ready)return;
 ui.localDirty=true;localStorage.setItem('tcm-pending-cloud','1');status('Modifiche da sincronizzare…');
 clearTimeout(ui.syncTimer);
 ui.syncTimer=setTimeout(async()=>{
  if(!ui.docRef||!navigator.onLine)return status('Offline: modifiche conservate sul dispositivo');
  try{await setDoc(ui.docRef,{payload:window.TCMBridge.get()});ui.localDirty=false;localStorage.removeItem('tcm-pending-cloud');status('Sincronizzato tra i dispositivi');}
  catch(e){ui.error=e.message;status('Salvataggio cloud fallito; dati locali conservati');}
 },450);
});
window.addEventListener('online',()=>{if(ui.user)initializeSync(true)});
refreshUI();
</script></body></html>
